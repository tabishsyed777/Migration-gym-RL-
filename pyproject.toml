[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migrationgym"
version = "0.1.0"
description = "A verifiable reinforcement-learning environment for staged database migrations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "gymnasium==1.2.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
migrationgym = "migrationgym.cli:main"

[tool.setuptools.packages.find]
include = ["migrationgym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
